name: PR Check
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v4.3.0
      - name: Vet
        run: mise run vet

      - name: Check formatting
        run: mise run format-check

      - name: Run tests
        run: mise run test
