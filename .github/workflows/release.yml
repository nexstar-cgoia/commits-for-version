name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Build for Linux
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o bin/commits-for-version-linux-amd64 ./internal

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/commits-for-version-linux-amd64
