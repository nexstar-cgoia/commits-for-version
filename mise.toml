[tools]
go = "latest"

[env]
_.file = ".env"

[tasks.start]
run = "go run ./internal"
description = "Run the main.go file"

[tasks.cmd]
run = "go run ."
description = "Run the main.go file from the cmd directory"

[tasks.build]
run = "go build -o bin/commits-for-version ."
description = "Build the Go application"

[tasks.format]
run = "gofmt -w ."
description = "Format the Go code"

[tasks.format-check]
run = "test -z \"$(gofmt -l .)\""
description = "Check formatting without modifying files; fails if any file is not gofmt-formatted"

[tasks.test]
run = "go test ./..."
description = "Run the tests"

[tasks.vet]
run = "go vet ./..."
description = "Run the Go vet tool to examine Go source code for potential issues"
